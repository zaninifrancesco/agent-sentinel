name: Release

# Push a tag like v0.1.0 to publish the macOS and Linux archives.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      # Builds the cockpit, then one archive per platform and checksums.txt.
      - name: Package
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --generate-notes --title "$GITHUB_REF_NAME"
